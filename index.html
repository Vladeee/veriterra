<!doctype html>
<html lang="en" data-brand="vitreeone">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VITREEONE Brand System</title>
  <meta name="description" content="VITREEONE brand system: presentation of five landings and the style guide. Working draft.">
  <meta name="theme-color" content="#FBFAF7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="VITREEONE">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="brand/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="brand/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="brand/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="brand/tokens.css">
  <link rel="stylesheet" href="brand/components.css">
  <style>
    .hub {
      display: flex;
      flex-direction: column;
      gap: var(--space-7);
      padding-top: max(var(--space-8), env(safe-area-inset-top));
      padding-bottom: max(var(--space-8), env(safe-area-inset-bottom));
    }

    .hub__links {
      display: grid;
      gap: var(--grid-gap);
      grid-template-columns: 1fr;
    }

    @media (min-width: 48rem) {
      .hub__links { grid-template-columns: 1fr 1fr; }
    }

    .hub__card {
      min-height: calc(var(--space-10) * 1.5);
      justify-content: space-between;
      padding: var(--space-6);
    }

    .hub__card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--space-4);
    }

    .hub__card .card__title {
      font-size: var(--text-3xl);
      line-height: var(--leading-tight);
    }
  </style>
</head>
<body>
  <main class="hub container">
    <header class="stack">
      <div class="cluster">
        <span class="tag tag--warning">Working draft</span>
        <span class="eyebrow">Skeleton</span>
      </div>
      <h1 data-brand-name="vitreeone"></h1>
      <p class="lead">The group and its four companies: Veriterra, Verdo, Vaya and Viva. One landing each, same structure, styled one by one.</p>
    </header>

    <div class="hub__links">
      <a class="card card--accent card--interactive hub__card" href="deck/">
        <div class="hub__card-head">
          <span class="eyebrow">Five landings</span>
          <span class="icon icon--lg" data-icon="arrow-right"></span>
        </div>
        <span class="card__title">Presentation</span>
      </a>
      <a class="card card--interactive hub__card" href="styleguide/">
        <div class="hub__card-head">
          <span class="eyebrow">Typography · Veriterra</span>
          <span class="icon icon--lg" data-icon="arrow-right"></span>
        </div>
        <span class="card__title">Style guide</span>
      </a>
    </div>
  </main>

  <script src="brand/brands.js"></script>
  <script src="brand/brand-ui.js"></script>
</body>
</html>
